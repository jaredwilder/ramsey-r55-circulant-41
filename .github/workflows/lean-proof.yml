name: Lean Ramsey Proof Replay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan and pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.31.0-rc1
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.31.0-rc1

      - name: Verify toolchain
        run: lean --version

      - name: Compile self-contained proof file
        run: lean lean-proof/R55Final.lean

      - name: Audit source escape surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('lean-proof/R55Final.lean').read_text(encoding='utf-8')
          lines = text.splitlines()
          # Count only standalone tactic/admission lines; prose comments mentioning the word do not count.
          sorry_lines = [(i+1, line.strip()) for i, line in enumerate(lines) if re.fullmatch(r'\s*sorry\s*', line)]
          print('standalone sorry lines:', sorry_lines)
          assert len(sorry_lines) == 1
          n = sorry_lines[0][0]
          context = '\n'.join(lines[max(0, n-8):n])
          assert 'frontier_obligation62' in context
          # No top-level project axiom/unsafe declaration is permitted.
          assert not any(re.match(r'^\s*axiom\s+', line) for line in lines)
          assert not any(re.match(r'^\s*unsafe\s+', line) for line in lines)
          PY

      - name: Print axioms of campaign theorem
        run: |
          cp lean-proof/R55Final.lean /tmp/R55Audit.lean
          printf '\n#print axioms R55_CAMPAIGN\n' >> /tmp/R55Audit.lean
          lean /tmp/R55Audit.lean 2>&1 | tee /tmp/r55-axioms.txt
          echo '--- campaign axiom tail ---'
          tail -n 30 /tmp/r55-axioms.txt
          if grep -q 'sorryAx' /tmp/r55-axioms.txt; then
            echo 'R55_CAMPAIGN axiom print unexpectedly contains sorryAx' >&2
            exit 1
          fi
